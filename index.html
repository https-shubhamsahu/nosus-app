  <!--
    The first web frame is the NO SUS wordmark itself. This has no image,
    external font, or startup work: Flutter removes it as soon as its first
    real frame is ready, so branding never creates a minimum load time.
  -->
  <style>
    /* Day ("Notebook") paper by default, Night ("Lamp") when the saved choice
       says so (see the script below). Never pure black or white. */
    :root { color-scheme: light; --boot-bg: #F7F5EE; --boot-ink: #1F2433; }
    :root.boot-night { color-scheme: dark; --boot-bg: #141311; --boot-ink: #ECE6DA; }
    html, body { margin: 0; min-height: 100%; background: var(--boot-bg); }
    #boot-loader {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      box-sizing: border-box;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      background: var(--boot-bg);
      transition: opacity 100ms linear;
    }
    /* One-time-link routes say what is opening (see the route script under
       #boot-loader). Plain text: no shimmer, no button. */
    #boot-loader .boot-line {
      margin: 18px 0 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      color: var(--boot-ink);
      font-size: 16px;
      font-weight: 500;
      line-height: 1.4;
      text-align: center;
      opacity: 0.72;
    }
    #boot-loader .boot-line[hidden] { display: none; }
    #boot-loader.boot-hidden {
      opacity: 0;
      pointer-events: none;
    }
    #boot-loader .boot-mark {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      color: var(--boot-ink);
      font-size: clamp(34px, 9vw, 48px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    #boot-loader .boot-stop {
      width: 0.21em;
      height: 0.21em;
      margin-left: 0.08em;
      margin-bottom: 0.02em;
      display: inline-block;
      vertical-align: baseline;
      background: #808080;
      animation: boot-stop-settle 180ms cubic-bezier(.2, .7, .3, 1) 60ms both;
    }
    @keyframes boot-stop-settle {
      from { opacity: 0; transform: translateY(-2px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot-loader, #boot-loader .boot-stop { transition: none; animation: none; }
    }
  </style>
  <script>
    // The app keeps Day / Night / Follow phone in localStorage (SharedPreferences
    // on web: key "flutter.nosus_theme_mode", value JSON-encoded). Read it before
    // first paint so a Night reader is not flashed a bright boot screen.
    //
    // The one-time-link viewers (#/burn/, #burn/, #/burnfile/, #/burnfiles/)
    // follow the phone instead of the saved choice (viewerThemeMode in
    // share_states.dart), so their boot colours come from prefers-color-scheme
    // only. Only the route prefix is read: never the key, never logged.
    (function () {
      try {
        var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var night;
        if (/^#(\/?burn|\/burnfiles?)\//.test(location.hash || '')) {
          night = !!mq;
        } else {
          var raw = localStorage.getItem('flutter.nosus_theme_mode');
          var mode = raw ? JSON.parse(raw) : 'light';
          night = mode === 'dark' || (mode === 'system' && !!mq);
        }
        if (night) document.documentElement.classList.add('boot-night');
      } catch (e) {}
    })();
  </script>

  <script>
    // google_sign_in_web appends Google's sign-in script
    // (accounts.google.com/gsi/client) as soon as the app starts, so every
    // visitor, even someone only opening a one-time link, would contact Google.
    // Hold that one script back; the app calls nosusLoadGoogleSignIn() right
    // before Drive needs Google (lib/features/address/google_script.dart).
    // Supabase's "Continue with Google" is a redirect and does not need it.
    (function () {
      var GSI = 'https://accounts.google.com/gsi/client';
      var append = Node.prototype.appendChild;
      var held = null;
      var released = false;
      Node.prototype.appendChild = function (node) {
        if (!released && node && node.tagName === 'SCRIPT' &&
            String(node.src || '').indexOf(GSI) === 0) {
          held = { parent: this, node: node };
          return node;
        }
        return append.call(this, node);
      };
      window.nosusLoadGoogleSignIn = function () {
        if (released) return;
        released = true;
        if (held) append.call(held.parent, held.node);
        held = null;
      };
    })();
  </script>

  <script>
    // Notes and files waiting to save to Drive live only in this tab's memory
    // on the web. While any wait, the app sets sessionStorage "nosus_unsaved"
    // to "1" (SavedController.unsavedTabKey) and the browser asks before the
    // tab closes or reloads. A reload has already lost them, so the flag is
    // cleared as the page starts.
    (function () {
      try { sessionStorage.removeItem('nosus_unsaved'); } catch (e) {}
      window.addEventListener('beforeunload', function (event) {
        try {
          if (sessionStorage.getItem('nosus_unsaved') !== '1') return;
        } catch (e) { return; }
        event.preventDefault();
        event.returnValue = '';
      });
    })();
  </script>

  <!--
    supabase_flutter's Auth client wires up passkey/WebAuthn support by
    default, which pulls in the `passkeys_web` plugin. That plugin's
    registerWith() runs automatically on EVERY page load (Flutter Web plugin
    registration is unconditional, independent of whether the app ever uses
    passkeys) and calls `PasskeyAuthenticator.init()` unconditionally, even
    when this script hasn't loaded — crashing with
    "Cannot read properties of undefined (reading 'init')" on every page,
    including the SecureSend anonymous share link. This script (vendored
    locally instead of pointed at a GitHub releases URL, to avoid an external
    runtime dependency) defines the global `PasskeyAuthenticator` the plugin
    expects, so registration succeeds even though the app doesn't use passkeys.
    Must load BEFORE flutter_bootstrap.js (no async/defer) — Flutter's plugin
    registration runs during engine boot, not after DOMContentLoaded.
  -->
  <script src="passkeys-bundle.js"></script>
</head>
<body>
  <script>
    // Android: open the installed app instead of this web app.
    //
    // A QR or link to app.nosus.foo often lands in a browser (camera apps and
    // Lens open links in a tab), where Google sign-in and the device keys are
    // weaker than in the app. Same handoff as nosus.foo's legacy-link shim:
    // intent://open?u=<this url> → MainActivity → unwrapAppOpenLink(), and
    // Chrome falls back to browser_fallback_url when the app isn't installed.
    // The fallback carries ?nosus_web=1 so it can never loop.
    //
    //  - App links (#/go/, #/burn/, #/join/ …): hand off at once.
    //  - Plain visits: a dismissible "Open in the app" bar, no redirect.
    //  - Sign-in callbacks: never — the session belongs to this tab.
    //  - In-app browsers (Instagram, Facebook, any Android WebView "; wv)"):
    //    neither. They can't follow intent:// reliably, so the reader would
    //    land on a blank or error page; they stay on this web app.
    (function (w) {
      try {
        var ua = w.navigator.userAgent || '';
        if (!/android/i.test(ua)) return;
        var l = w.location, h = l.hash || '', s = l.search || '';
        if (/[?&]code=/.test(s) || /(access_token|refresh_token|error_description|type=recovery)/.test(h)) return;
        var params = new URLSearchParams(s);
        var stay = params.get('nosus_web') === '1';
        params.delete('nosus_web');
        var q = params.toString();
        var here = l.origin + l.pathname + (q ? '?' + q : '') + h;
        if (stay) {
          try { w.history.replaceState(null, '', l.pathname + (q ? '?' + q : '') + h); } catch (e) {}
          return;
        }
        if (/; wv\)|Instagram|FBAN|FBAV|FB_IAB/.test(ua)) return;
        var fallback = l.origin + l.pathname + '?' + (q ? q + '&' : '') + 'nosus_web=1' + h;
        var intent = 'intent://open?u=' + encodeURIComponent(here) +
          '#Intent;scheme=foo.nosus.app;package=foo.nosus.app;S.browser_fallback_url=' +
          encodeURIComponent(fallback) + ';end';
        if (/^#\/?(go|burn|burnfile|burnfiles|redeem|v|join)\//.test(h)) {
          w.location.replace(intent);
          return;
        }
        try { if (w.sessionStorage.getItem('nosus_open_app_dismissed')) return; } catch (e) {}
        w.addEventListener('DOMContentLoaded', function () {
          var bar = document.createElement('div');
          bar.setAttribute('role', 'region');
          bar.setAttribute('aria-label', 'Open in the NO SUS app');
          bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));' +
            'z-index:999998;display:flex;align-items:center;gap:8px;padding:10px 10px 10px 16px;border-radius:14px;' +
            'background:#F7F5EE;color:#1F2433;font:600 14px ui-sans-serif,system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.35)';
          bar.innerHTML = '<span style="flex:1">Open in the NO SUS app</span>' +
            '<a id="nosus-open-app" href="#" style="background:#1F2433;color:#F7F5EE;padding:10px 16px;border-radius:10px;text-decoration:none;min-height:24px">Open</a>' +
            '<button id="nosus-open-app-x" aria-label="Dismiss" style="background:none;border:0;font-size:20px;line-height:1;padding:8px;min-width:44px;min-height:44px;color:#1F2433">×</button>';
          document.body.appendChild(bar);
          document.getElementById('nosus-open-app').addEventListener('click', function (e) {
            e.preventDefault();
            // Re-read: the Flutter app may have routed since load.
            var cur = w.location;
            var curQ = new URLSearchParams(cur.search || '');
            curQ.delete('nosus_web');
            var qs = curQ.toString();
            var now = cur.origin + cur.pathname + (qs ? '?' + qs : '') + (cur.hash || '');
            var back = cur.origin + cur.pathname + '?' + (qs ? qs + '&' : '') + 'nosus_web=1' + (cur.hash || '');
            w.location.href = 'intent://open?u=' + encodeURIComponent(now) +
              '#Intent;scheme=foo.nosus.app;package=foo.nosus.app;S.browser_fallback_url=' +
              encodeURIComponent(back) + ';end';
          });
          document.getElementById('nosus-open-app-x').addEventListener('click', function () {
            try { w.sessionStorage.setItem('nosus_open_app_dismissed', '1'); } catch (e) {}
            bar.remove();
          });
        });
      } catch (e) {}
    })(window);
  </script>
  <div id="boot-loader">
    <div class="boot-mark" role="status" aria-live="polite" aria-label="NO SUS opening application">NO SUS<span class="boot-stop" aria-hidden="true"></span></div>
    <p class="boot-line" aria-hidden="true" hidden></p>
  </div>
  <script>
    // Route-aware boot line. A one-time link says what is opening, so a reader
    // on a slow connection knows the page is working. The status node above
    // keeps its role; its aria-label is what screen readers hear (it overrides
    // the text inside), so it carries the line and the visible copy stays
    // aria-hidden: still exactly one status node. Only the route prefix is
    // read, never the key; nothing is logged or sent.
    (function () {
      try {
        var h = location.hash || '';
        var line = null;
        if (/^#\/?burn\//.test(h)) line = 'A note that opens once.';
        else if (/^#\/burnfiles?\//.test(h)) line = 'A file that opens once.';
        else if (/^#\/redeem\//.test(h)) line = 'Opening a link…';
        if (!line) return;
        var root = document.getElementById('boot-loader');
        var mark = root.querySelector('.boot-mark');
        var el = root.querySelector('.boot-line');
        el.textContent = line;
        el.hidden = false;
        mark.setAttribute('aria-label', line === 'Opening a link…'
          ? 'NO SUS. Opening a link.'
          : 'NO SUS. ' + line + ' Opening.');
      } catch (e) {}
    })();
  </script>
  <script>
    (function() {
      // Flutter Web dispatches this once the engine paints its first real
      // frame — remove the boot loader then, with a generous timeout
      // fallback so a missed event (older engine builds, unusual load
      // paths) never leaves it stuck on screen forever.
      function hideBootLoader() {
        const el = document.getElementById('boot-loader');
        if (!el) return;
        el.classList.add('boot-hidden');
        setTimeout(function() { el.remove(); }, 100);
      }
      window.addEventListener('flutter-first-frame', hideBootLoader, { once: true });
      setTimeout(hideBootLoader, 12000);
    })();
  </script>
  <script>
    // A new one-open link opened in a tab that is already running (pasted
    // into the address bar, or a link tapped on this page): the app reads its
    // link only when it starts, and a standalone viewer has no route for it,
    // so start again with the new one. Flutter's own URL updates use the
    // History API and never fire hashchange. Prefix test only: the key is
    // never read or logged.
    window.addEventListener('hashchange', function() {
      if (/^#\/?burn(?:file|files)?\//.test(window.location.hash)) window.location.reload();
    });
  </script>
  <script>
    // Android only: a sign-in that came back to this browser tab can be
    // handed to the installed app (the legacy login-callback scheme). There is
    // no NO SUS app for iPhone or iPad, so there the button went nowhere: they
    // stay on the web app, which finishes the sign-in in this tab.
    (function() {
      const isAndroid = /Android/i.test(navigator.userAgent);
      const hasCode = window.location.search.includes('code=') || window.location.hash.includes('access_token=');
      if (isAndroid && hasCode) {
        const overlay = document.createElement('div');
        overlay.style.position = 'fixed';
        overlay.style.top = '0';
        overlay.style.left = '0';
        overlay.style.width = '100vw';
        overlay.style.height = '100vh';
        overlay.style.background = '#141311';
        overlay.style.color = '#ECE6DA';
        overlay.style.fontFamily = 'ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif';
        overlay.style.zIndex = '999999';
        overlay.style.display = 'flex';
        overlay.style.flexDirection = 'column';
        overlay.style.alignItems = 'center';
        overlay.style.justifyContent = 'center';
        overlay.style.padding = '30px';
        overlay.style.boxSizing = 'border-box';
        overlay.style.textAlign = 'center';

        overlay.innerHTML = `
          <div style="font-size: 27px; color: #ECE6DA; margin-bottom: 36px; font-weight: 800; letter-spacing: -0.5px;">NO SUS<span style="display: inline-block; width: 6px; height: 6px; margin-left: 3px; background: #808080;"></span></div>
          <h2 style="font-size: 20px; font-weight: 700; margin-top: 0; margin-bottom: 10px; color: #ECE6DA;">Finishing sign-in</h2>
          <p style="color: #A39D91; font-size: 14px; max-width: 320px; line-height: 1.5; margin-bottom: 32px;">
            Open NO SUS to continue.
          </p>
          <button id="open-app-btn" style="background-color: #ECE6DA; color: #141311; border: 1.5px solid #ECE6DA; padding: 15px 32px; border-radius: 12px; font-weight: 700; font-family: inherit; cursor: pointer; font-size: 15px; width: 100%; max-width: 260px;">
            OPEN APP
          </button>
          <a id="continue-web-btn" href="#" style="color: #A39D91; font-size: 14px; margin-top: 24px; text-decoration: underline;">
            Continue in browser
          </a>
        `;

        document.body.appendChild(overlay);

        document.getElementById('open-app-btn').addEventListener('click', function() {
          const params = window.location.search + window.location.hash;
          const redirectUri = 'io.supabase.nosus://login-callback' + params;
          window.location.href = redirectUri;
        });

        document.getElementById('continue-web-btn').addEventListener('click', function(e) {
          e.preventDefault();
          document.body.removeChild(overlay);
        });
      }
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader

  <script src="flutter_bootstrap.js" async></script>
